version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    groups:
      google-ads-bindings:
        patterns:
          - "Xamarin.Google.*"
          - "Xamarin.AndroidX.*"
          - "Jc.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
